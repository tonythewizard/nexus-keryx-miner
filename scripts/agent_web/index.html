<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS v0.0.3 — Keryx Miner</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><div><strong class="brand">N E X U S</strong><small>KERYX MINER</small></div><div id="heading">MATRIX WEB CONSOLE</div><button id="logout" hidden>Disconnect</button></header>
<main><section id="login" class="card login"><h1>Connect to NEXUS</h1><p>Use the shared API/MSP key from Development. The key stays in this tab's memory.</p><form id="login-form"><label>API/MSP key<input id="api-key" type="password" autocomplete="off" required></label><button type="submit">Connect</button></form><p id="login-error" role="alert"></p></section>
<div id="console" hidden><div id="status" role="status">Connecting…</div><nav id="tabs" aria-label="Miner pages"></nav><div id="notice" role="status" hidden></div><div id="controls" class="card" hidden></div><div id="panels"></div>
<details id="development-tools" class="card" hidden><summary>Source development and command jobs</summary><div class="tools"><label>Tracked source path<input id="source-path" placeholder="src/model/live_cuda_worker.cpp"></label><button id="open-source">Read source</button><pre id="source-text"></pre><label>Unified text patch<textarea id="patch" rows="7" spellcheck="false"></textarea></label><button id="propose">Save isolated proposal</button><label>Proposal ID<input id="proposal-id"></label><button id="apply">Apply in isolated worktree</button><p>No build or production deployment is performed by applying a proposal.</p><button id="history">Refresh jobs</button><pre id="job-history"></pre></div></details></div></main></body></html>
