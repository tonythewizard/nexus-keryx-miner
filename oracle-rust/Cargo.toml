[package]
name = "nexus-m21-oracle"
license = "GPL-3.0-only"
version = "0.1.0"
edition = "2021"

[dependencies]
keryx-consensus-core = { path = "../_deps/keryx-node-16d1864d835a/consensus/core" }
keryx-math = { path = "../_deps/keryx-node-16d1864d835a/math" }
blake3 = "1"
libc = "0.2"
borsh = { version = "1.5.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
