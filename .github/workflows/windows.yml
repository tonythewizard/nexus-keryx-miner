name: Windows native
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.local/vcpkg-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore compiled dependencies
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('tools/windows/vcpkg.json') }}
      - name: Pinned Windows dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/vcpkg-cache | Out-Null
          git clone https://github.com/microsoft/vcpkg.git .local/vcpkg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C .local/vcpkg checkout 23b8a8e7409c2d6346114a88e834165bde79a51c
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          for ($attempt = 0; $attempt -lt 3; $attempt++) {
            & .local/vcpkg/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -eq 0) { break }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          cmake -S . -B build/windows -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$pwd/.local/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="$pwd/tools/windows" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DNEXUS_ENABLE_GRPC=OFF -DNEXUS_ENABLE_CUDA=OFF -DNEXUS_ENABLE_VULKAN_JIT=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native executables
        run: cmake --build build/windows --config Release --parallel 2
      - name: Native CPU and Windows API tests
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Install CUDA compiler (no GPU execution)
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '13.0.2'
          sub-packages: '["nvcc", "cudart", "nvrtc", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: 'false'
      - name: Configure native NVIDIA worker
        shell: pwsh
        run: |
          cmake -S . -B build/windows-worker -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$pwd/.local/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="$pwd/tools/windows" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_MANIFEST_FEATURES=worker `
            -DNEXUS_ENABLE_GRPC=ON -DNEXUS_ENABLE_CUDA=ON -DNEXUS_ENABLE_VULKAN_JIT=OFF -DBUILD_TESTING=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows worker
        run: cmake --build build/windows-worker --config Release --target nexus-live-cuda-worker --parallel 2
      - name: Worker capability smoke check (no GPU)
        run: build/windows-worker/bin/Release/nexus-live-cuda-worker.exe --inference-capabilities
      - name: Fetch unmodified pinned oracle dependency
        run: python tools/fetch_upstream.py
      - name: Build independent native verifier
        run: cargo build --release --locked --manifest-path oracle-rust/Cargo.toml --jobs 2

      - name: Build matching inference runtime
        shell: pwsh
        run: |
          cmake -S tools/runtime -B build/runtime -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/runtime --config Release --target nexus_inference_runtime --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/runtime --config Release --prefix build/runtime-install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package reviewed build outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/runtime-install/licenses/libb2 | Out-Null
          Copy-Item build/windows-worker/_deps/nexus_blake2-src/COPYING build/runtime-install/licenses/libb2/COPYING
          foreach ($name in @('openssl', 'blake3')) {
            New-Item -ItemType Directory -Force "build/runtime-install/licenses/$name" | Out-Null
            Copy-Item "build/windows-worker/vcpkg_installed/x64-windows-static-md/share/$name/copyright" "build/runtime-install/licenses/$name/copyright"
          }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsroot = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem "$vsroot/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'MSVC redistribution directory unavailable' }
          python tools/package_release.py --platform windows `
            --worker-dir build/windows-worker/bin/Release `
            --oracle oracle-rust/target/release/nexus-m21-oracle.exe `
            --runtime-dir build/runtime-install --cuda-dir "$env:CUDA_PATH/bin" --crt-dir "$($crt.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload Windows preview and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-windows-x86_64-cuda-sm86-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled dependencies
        if: always() && steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('tools/windows/vcpkg.json') }}
