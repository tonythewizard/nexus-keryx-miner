[package]
name = "nexus-ai-response-bridge"
license = "GPL-3.0-only"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
keryx-inference = { path = "../vendor/keryx-inference-v057/inference" }
keryx-verifiable-inference = { path = "../vendor/keryx-verifiable-inference" }
blake2b_simd = "1"
blake3 = "1"
borsh = { version = "1", features = ["derive"] }
secp256k1 = { version = "0.29.0", features = ["global-context"] }
hex = "0.4"
log = "0.4"
prost = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tonic = { version = "0.8", default-features = false, features = ["prost"] }

[build-dependencies]
tonic-build = { version = "0.8", default-features = false, features = ["prost"] }

[dev-dependencies]
anyhow = "1"
keryx-verifiable-inference = { path = "../vendor/keryx-verifiable-inference", features = ["testkit"] }
